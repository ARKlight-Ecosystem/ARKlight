name: Desktop build

# Builds the native desktop host for the `examples/hello_desktop`
# example (see that directory's own README.md) on every push/PR, then
# launches it under a headless Xvfb to confirm it doesn't crash
# immediately -- see docs/Backends/DESKTOP-BACKEND-IMPLEMENTATION.md,
# Stages 2 and 3, mirroring the Android backend's own Stage 2/3
# workflow (.github/workflows/android-build.yml).
#
# Every generated file this workflow touches -- the `arklight build`
# output, the scaffolded GTK3 + WebKit2GTK project, and the compiled
# binary -- is produced fresh on the runner from the three commands
# in examples/hello_desktop/README.md, never committed to the repo
# (examples/hello_desktop/.gitignore keeps it that way locally too).

on:
  push:
    branches: [main, alpha]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build desktop example
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GTK3 + WebKit2GTK dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install ARKlight
        env:
          ARKLIGHT_ACCEPT_LICENSE: "1"
        run: python -m pip install -e .

      - name: Build the example site
        run: arklight build examples/hello_site/site.py -o examples/hello_desktop/build --no-open

      - name: Scaffold the desktop project
        run: arklight desktop scaffold examples/hello_desktop/build -o examples/hello_desktop/app

      - name: Build the desktop app
        run: arklight desktop build examples/hello_desktop/app

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: hello-desktop-app
          path: examples/hello_desktop/app/bin/*
          if-no-files-found: error

  launch-smoke-test:
    name: Launch on a headless display
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GTK3 + WebKit2GTK runtime and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install ARKlight
        env:
          ARKLIGHT_ACCEPT_LICENSE: "1"
        run: python -m pip install -e .

      - name: Build the example site
        run: arklight build examples/hello_site/site.py -o examples/hello_desktop/build --no-open

      - name: Scaffold the desktop project
        run: arklight desktop scaffold examples/hello_desktop/build -o examples/hello_desktop/app

      - name: Build the desktop app
        run: arklight desktop build examples/hello_desktop/app

      - name: Launch and confirm it doesn't crash immediately
        # A single line, not a multi-line block -- run separately, a
        # variable set on one line wouldn't survive to the next (same
        # reasoning as .github/scripts/android-smoke-test.sh's own
        # docstring note, on the Android side of this repo).
        run: |
          BIN=$(find examples/hello_desktop/app/bin -maxdepth 1 -type f | head -n1)
          xvfb-run -a timeout 5 "$BIN" & PID=$!; sleep 3; kill -0 "$PID" && echo "still running after 3s -- OK" || { echo "process exited early -- crash on launch"; exit 1; }
